name: Deploy

# Deliberately no `pull_request` trigger: nothing that runs here may be started
# by a pull request, because this job holds the SSH key and the host's secrets.
# (The repository is private, which removes the forked-PR path, but the trigger
# is scoped anyway.)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: >-
          Directory on the host to deploy into. Leave EMPTY for production
          (the DEPLOY_PATH secret). Give a different path to rehearse the
          pipeline against a staging directory or subdomain first.
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time: two rsyncs into the same tree must not interleave.
# Never cancel one half-way through.
concurrency:
  group: deploy
  cancel-in-progress: false

# Configuration the author must create:
#   Secrets:   SSH_PRIVATE_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, MAPILLARY_TOKEN
#   Variables: DEPLOY_HOST_KEY (required), DEPLOY_PORT (optional, default 22)
# DEPLOY_HOST_KEY is the host's PUBLIC key, which is not secret, hence a
# variable: the "ssh-ed25519 AAAA..." part of `ssh-keyscan -t ed25519 <host>`
# (the type and base64 blob, without the leading hostname field). Take it from
# the host's own console or a network you trust, not from this pipeline.

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Secrets are scoped to the steps that use them, not the job, so an npm
      # lifecycle script or a test never sees them.
      - name: Check configuration
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
        run: |
          missing=0
          for name in SSH_PRIVATE_KEY DEPLOY_HOST DEPLOY_USER DEPLOY_PATH MAPILLARY_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          if [ -z "$DEPLOY_HOST_KEY" ]; then
            echo "::error::Repository variable DEPLOY_HOST_KEY is not set (the host's public key, e.g. 'ssh-ed25519 AAAA...'). It is a variable, not a secret."
            missing=1
          fi
          [ "$missing" = 0 ] || exit 1

      - name: Choose the deploy target
        env:
          TARGET_INPUT: ${{ inputs.target }}
          PROD_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$TARGET_INPUT" ]; then
            echo "DEPLOY_DIR=$TARGET_INPUT" >> "$GITHUB_ENV"
            echo "Rehearsal deploy to the path given as input."
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            # A manual run of some other branch must not reach production.
            echo "::error::Production deploys run from main only; give a staging target to rehearse a branch."
            exit 1
          else
            echo "DEPLOY_DIR=$PROD_PATH" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4

      # ---- 1. Frontend build -------------------------------------------------
      # Node 24 is pinned explicitly: Angular 22 rejects Node 25.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npx ng build
      # Frontend tests (vitest + jsdom, no browser needed). `ng build` alone
      # passes with broken behaviour; a failure here stops the deploy.
      - name: Test the frontend
        working-directory: frontend
        run: npx ng test --watch=false

      # ---- 2. Backend lint and tests (a failure here stops the deploy) -------
      # Python 3.12: the host's interpreter measured at 3.12.15, and
      # backend/pyproject.toml says `requires-python = ">=3.12"`. This value
      # MUST match the interpreter $DEPLOY_DIR/.venv was built with, because
      # requirements.txt is resolved here and installed there; if the host's
      # minor version changes, change this and the floor together.
      # backend/tests/test_versions.py fails if the two drift apart. That test
      # pins only that they agree: that the code runs on 3.12 is shown by this
      # job running on it, not by anything checked before the first run.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # uv comes from PyPI rather than a third-party action: this job later
      # holds the SSH key, so it uses as few third-party actions as possible.
      # Unpinned on purpose for now; pin `uv==X.Y.Z` once a version is known good.
      - name: Install uv
        run: python -m pip install uv

      # ---- 3. Resolve dependencies and export requirements.txt --------------
      # `uv sync` (not `--frozen`, not `uv lock --check`) because uv.lock is
      # known to be STALE: pyproject.toml names a2wsgi but the lockfile was not
      # regenerated (no network where it was written). Re-resolving is what makes
      # this work. Once a regenerated uv.lock is committed, `--frozen` is the
      # better choice here and on the export below; do not switch before then or
      # the build breaks.
      - name: Resolve dependencies
        working-directory: backend
        run: uv sync
      - name: Lint
        working-directory: backend
        run: uv run ruff check app tests ../content/scripts
      - name: Test
        working-directory: backend
        run: uv run pytest -q
      - name: Export requirements.txt for the host (pip, not uv)
        working-directory: backend
        run: uv export --no-dev --no-hashes --no-emit-project -o requirements.txt

      # ---- 4. Ship ----------------------------------------------------------
      # The key is written only now, after build and test, so neither ever sees it.
      # The host key is PINNED from a repository variable. Scanning it here
      # (ssh-keyscan) would be trust on every use, not first use: the runner is
      # fresh each time, so anything answering at that address would be
      # trusted, receive the source and .env, and could report success.
      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ "$DEPLOY_PORT" = 22 ]; then
            printf '%s %s\n' "$DEPLOY_HOST" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          else
            printf '[%s]:%s %s\n' "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<CONFIG
          Host deploy-host
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            BatchMode yes
            ServerAliveInterval 30
            ServerAliveCountMax 4
          CONFIG

      # NEVER add `--delete` (or --delete-excluded, --remove-source-files) to
      # these rsyncs. Historians' in-progress tours live in Settings.sessions_dir
      # (default ~/.clio-wired/sessions), OUTSIDE the deploy tree so rsync cannot
      # reach them: that is the first defence. Not deleting anything is the
      # second. A deploy that destroys a tour is a failure condition, so the cost
      # of this choice (a file removed from the repo lingers on the host until
      # someone removes it by hand) is accepted on purpose.
      #
      # Layout on the host mirrors the repository, because Settings derives
      # content_dir and frontend_dist from the backend's location.
      - name: Copy files to the host
        run: |
          ssh deploy-host "mkdir -p '$DEPLOY_DIR/backend' '$DEPLOY_DIR/content' '$DEPLOY_DIR/deploy' '$DEPLOY_DIR/frontend/dist/frontend/browser'"
          RSYNC="rsync -rlt --itemize-changes -e ssh"
          # --chmod is required: `rsync -rlt` carries no permissions, so
          # without it app.cgi arrives mode 644 and Apache 500s on it.
          $RSYNC --chmod=F755 app.cgi "deploy-host:$DEPLOY_DIR/"
          # The front controller. It belongs at the document root, beside
          # app.cgi, because it finds the bundle under %{DOCUMENT_ROOT} and
          # Apache only reads it for the directory it is in and below. 644,
          # not 755: Apache reads this one, nothing executes it. The mode is
          # given explicitly for the same reason app.cgi's is -- `rsync -rlt`
          # carries none -- and an .htaccess Apache cannot READ is 500 on
          # every URL in the tree, the same outage as a syntax error in it.
          #
          # STAGED as .htaccess.new, NOT written straight to .htaccess. The
          # live file is the one cPanel's Directory Privacy writes the shared
          # password into (docs/DEPLOY.md step 8) -- it protects a directory by
          # putting AuthType/AuthName/AuthUserFile/Require valid-user in THAT
          # directory's .htaccess, and the directory it protects here is the
          # document root, which is this one. Overwriting it removes the only
          # access control the deployment has, with nothing anywhere to say so,
          # because the file is perfectly valid without those lines. The
          # install step below merges the two instead.
          #
          # .htaccess.new is left on the host only if that merge fails; it is
          # not served (rule 3 sends every unknown path to the bundle's
          # index.html, and Apache's own config refuses ^\.ht anyway).
          $RSYNC --chmod=F644 .htaccess "deploy-host:$DEPLOY_DIR/.htaccess.new"
          # The merge script, which does that composing. F755 for consistency
          # with app.cgi, but the install step invokes it through `bash` rather
          # than relying on the bit: `--chmod` only applies to files rsync
          # CREATES, so a copy already on the host with the wrong mode would
          # never be repaired, and this is not a file to lose the password over.
          $RSYNC --chmod=F755 deploy/merge-htaccess.sh "deploy-host:$DEPLOY_DIR/deploy/"
          $RSYNC \
            --exclude '.venv' --exclude '.env' --exclude '__pycache__' \
            --exclude '.pytest_cache' --exclude '.ruff_cache' --exclude 'uv.lock' \
            backend/ "deploy-host:$DEPLOY_DIR/backend/"
          $RSYNC frontend/dist/frontend/browser/ "deploy-host:$DEPLOY_DIR/frontend/dist/frontend/browser/"
          # content/work is the vestigial pre-sessions directory; it is
          # gitignored so absent from a checkout, and excluded as insurance.
          # Anchored (/work) so it only matches content/work, nothing deeper.
          $RSYNC --exclude '/work' content/ "deploy-host:$DEPLOY_DIR/content/"

      # ---- 5. The host's .env, from secrets ---------------------------------
      # Piped over stdin so the token never appears in a process listing or log.
      # Written ONLY WHEN ABSENT: backend/.env is host-owned state. The first
      # deploy bootstraps it; later deploys leave it alone, so a SESSIONS_DIR or
      # a lowered cap the operator added survives (rsync already excludes .env
      # for the same reason). The cost: a rotated MAPILLARY_TOKEN secret is NOT
      # picked up; edit backend/.env on the host. stdin is drained when skipping
      # so the pipe never breaks.
      - name: Write backend/.env (only if absent)
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
        run: |
          printf 'MAPILLARY_TOKEN=%s\n' "$MAPILLARY_TOKEN" \
            | ssh deploy-host "umask 077 && if [ -e '$DEPLOY_DIR/backend/.env' ]; then cat > /dev/null; echo 'backend/.env already exists on the host: left alone (token and other settings NOT updated).'; else cat > '$DEPLOY_DIR/backend/.env' && echo 'backend/.env did not exist: created it.'; fi"

      # ---- 6. Install dependencies on the host -------------------------------
      # The venv is at $DEPLOY_DIR/.venv. That is a DEPLOY CONTRACT, not a
      # guess about the host's layout: app.cgi runs "$(dirname $0)/.venv/bin/
      # python", the runbook (docs/DEPLOY.md step 4) creates the venv there by
      # hand once, and the rsyncs above exclude .venv so a deploy never
      # touches it. The step before this one only ever read a path cPanel's
      # "Setup Python App" would have created -- a feature this host does not
      # offer, which is the whole reason the app runs as CGI.
      #
      # Nothing is restarted. There is no resident process to restart: Apache
      # executes app.cgi fresh on every request, so new files are live the
      # moment rsync finishes. (The `tmp/restart.txt` this step used to touch
      # was Passenger's signal, and `tmp/` is no longer created at all.)
      - name: Install dependencies
        run: |
          ssh deploy-host "bash -s" <<REMOTE
          set -euo pipefail
          DIR='$DEPLOY_DIR'
          VENV="\$DIR/.venv"
          if [ ! -x "\$VENV/bin/python" ]; then
            echo "No interpreter at \$VENV/bin/python. Create the virtualenv once, by hand, as described in docs/DEPLOY.md step 4; the deploy installs into it but never creates it." >&2
            exit 1
          fi
          "\$VENV/bin/pip" install -r "\$DIR/backend/requirements.txt"
          # Install the front controller WITHOUT removing the shared password:
          # .htaccess becomes the staged copy plus whatever auth directives the
          # host's file already carried, written atomically and with the staged
          # copy removed. The script exits non-zero and changes nothing if it
          # cannot read either file, and `set -e` above turns that into a failed
          # deploy -- deliberately, because the alternative is a deploy that
          # reports success while having opened the editor to the internet.
          # Run through `bash` so the script's mode on the host cannot matter.
          # Tested in backend/tests/test_merge_htaccess.py; the reasoning, and
          # what it does NOT preserve, is in the script's own header.
          bash "\$DIR/deploy/merge-htaccess.sh" "\$DIR/.htaccess" "\$DIR/.htaccess.new"
          # NOT redundant with the --chmod flags above: --chmod only applies
          # to files rsync CREATES, so a file already on the host with the
          # wrong mode (an earlier deploy without --chmod, or a hand-edit
          # through the file manager) would never be repaired. Either one
          # costs the whole tree: an app.cgi Apache cannot execute and an
          # .htaccess it cannot read are both 500 on every URL. Cheap to do
          # on every deploy, so it is done on every deploy.
          #
          # The .htaccess line is now the belt behind merge-htaccess.sh's own
          # brace -- it chmods the file it writes, because it is also run by
          # hand during an incident -- and it stays here anyway: the cost is
          # one syscall and the failure it covers is the whole subdomain.
          chmod 755 "\$DIR/app.cgi"
          chmod 644 "\$DIR/.htaccess"
          REMOTE
