@if (decision() === 'probing' || decision() === 'published') {
  <!-- Mounted from the first paint, so the viewer's tour-data/ fetches run
       alongside the probe; hidden until the probe says this really is a
       published site, because an authoring checkout with nothing open makes
       those fetches 404 and the viewer say so. -->
  <div class="viewer-slot" data-viewer [hidden]="decision() === 'probing'">
    <app-viewer-page />
  </div>
} @else {
  <!-- The front door, and the only branch an author with nothing open
       reaches. Deferred, so it is its own chunk: a published site's visitor
       never takes this branch and must not download it. `on immediate`
       because the decision is already made — there is nothing to wait for,
       and anything slower would show a blank page in its place. -->
  @defer (on immediate) {
    <app-welcome-page />
  } @placeholder {
    <p class="pending">Opening…</p>
  }
}
