@if (error()) {
  <p class="fatal" data-error>{{ error() }}</p>
} @else if (ready()) {
  <main class="layout" data-ready>
    <section class="panorama-slot">
      <app-panorama-pane />
    </section>
    <section class="map-slot"><app-map-pane [theme]="resolved()" /></section>
    <aside class="panel-slot"><app-stop-panel /></aside>
    <footer class="attribution">
      <span class="tour-title">{{ tourTitle() }}</span>
      <!-- Tracked by text, not url: a url is nullable as of schema v3, and
           two credits with nothing to link to would share a null key. -->
      @for (a of attribution(); track a.text) {
        @if (a.url) {
          <a [href]="a.url" target="_blank" rel="noopener">{{ a.text }}</a>
        } @else {
          <span>{{ a.text }}</span>
        }
      }
      <a href="https://github.com/wasianp0wer/toursprout" target="_blank" rel="noopener">Powered by TourSprout</a>
    </footer>
  </main>
} @else {
  <p class="loading">Loading the tour…</p>
}
